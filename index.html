<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aria of Sorrow Map & World Randomizer</title>
  <style>
    :root {
      --bg-color: #0d0a12;
      --card-bg: #16121e;
      --accent: #8b0000;
      --accent-hover: #a80000;
      --text: #e2e2e2;
      --text-dim: #9a98a6;
      --border: #2e263b;
      --drawer-bg: #100d17;
      --success: #00ff66;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 100%;
      max-width: 780px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    h1 {
      color: #ff4d4d;
      text-align: center;
      margin-top: 0;
      font-size: 1.8rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-bottom: 2px solid var(--border);
      padding-bottom: 15px;
    }

    .section {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: var(--text);
    }

    input[type="file"], input[type="number"], input[type="text"], select {
      width: 100%;
      padding: 10px;
      background-color: #0b0910;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 4px;
      box-sizing: border-box;
    }

    .checkbox-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 10px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      font-weight: normal;
      cursor: pointer;
    }

    .checkbox-label input {
      margin-right: 10px;
      accent-color: var(--accent);
    }

    .option-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 10px;
    }

    .option-group label {
      font-size: 0.85rem;
      color: var(--text-dim);
      font-weight: normal;
    }

    .seed-row {
      display: flex;
      gap: 10px;
    }

    .seed-row button {
      width: auto;
      white-space: nowrap;
    }

    button.btn {
      width: 100%;
      padding: 12px;
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button.btn:hover {
      background-color: var(--accent-hover);
    }

    button.btn:disabled {
      background-color: #3d1b1b;
      cursor: not-allowed;
      opacity: 0.6;
    }

    #console {
      background-color: #060508;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 12px;
      height: 110px;
      overflow-y: auto;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.85rem;
      color: var(--success);
      margin-top: 15px;
    }

    .log-entry { margin-bottom: 4px; }
    .log-error { color: #ff4d4d; }

    /* Spoiler Drawer */
    .drawer-toggle {
      background-color: #120e18;
      border: 1px solid var(--border);
      color: var(--text-dim);
      width: 100%;
      padding: 10px 15px;
      text-align: left;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
      transition: color 0.2s, background-color 0.2s;
    }

    .drawer-toggle:hover {
      color: var(--text);
      background-color: #1a1523;
    }

    .drawer-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out;
      background-color: var(--drawer-bg);
      border: 1px solid transparent;
      border-top: none;
      border-radius: 0 0 4px 4px;
    }

    .drawer-content.open {
      max-height: 380px;
      overflow-y: auto;
      border-color: var(--border);
      padding: 15px;
    }

    .spoiler-text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.85rem;
      color: #d1c4e9;
      white-space: pre-wrap;
      margin: 0;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>AoS Map & World Randomizer</h1>

  <!-- ROM Upload -->
  <div class="section">
    <label for="romFile">1. Select USA GBA ROM File:</label>
    <input type="file" id="romFile" accept=".gba">
  </div>

  <!-- Seed Configuration -->
  <div class="section">
    <label for="seedInput">2. Seed Number:</label>
    <div class="seed-row">
      <input type="number" id="seedInput" value="1337">
      <button class="btn" id="btnRandomSeed" type="button">Randomize Seed</button>
    </div>
  </div>

  <!-- Quality of Life & Special Ability Options -->
  <div class="section">
    <label>3. Quality of Life & Abilities:</label>
    <div class="option-grid">
      <div class="option-group">
        <label for="selPanther">Black Panther Setting (panther):</label>
        <select id="selPanther">
          <option value="Vanilla">Vanilla</option>
          <option value="FirstAlways">Always First</option>
          <option value="AlwaysRand">Always Random</option>
          <option value="ExtraFairRand">Extra Fair Random</option>
          <option value="NeverExists">Never Exists</option>
        </select>
      </div>
      <div class="option-group">
        <label for="chkBackdash">Start with Backdash:</label>
        <div style="margin-top: 10px;">
          <label class="checkbox-label">
            <input type="checkbox" id="chkBackdash" checked> Enable Backdash on New Game
          </label>
        </div>
      </div>
    </div>
  </div>

  <!-- Shop Options (Defaulting to Always Unlocked) -->
  <div class="section">
    <label>4. Shop Options (AoS Surge Settings):</label>
    <div class="option-grid">
      <div class="option-group">
        <label for="selStartShop">Start with Shop (startshop):</label>
        <select id="selStartShop">
          <option value="Unlocked" selected>Unlocked (Always Start Available)</option>
          <option value="Unlocked30k">Unlocked + 30k Gold</option>
          <option value="Vanilla">Vanilla (Locked)</option>
        </select>
      </div>
      <div class="option-group">
        <label for="selShopPrice">Shop Price (shopprice):</label>
        <select id="selShopPrice">
          <option value="Vanilla">Vanilla</option>
          <option value="RandHV">Random HV (High Variance)</option>
        </select>
      </div>
      <div class="option-group">
        <label for="selShopSouls">Shop Souls (shopSouls):</label>
        <select id="selShopSouls">
          <option value="Vanilla">Vanilla</option>
          <option value="2PerGroup">2 per group</option>
          <option value="Half">Half</option>
          <option value="OnlySouls">Only souls</option>
        </select>
      </div>
      <div class="option-group">
        <label for="chkShopTiers">Structure:</label>
        <div style="margin-top: 10px;">
          <label class="checkbox-label">
            <input type="checkbox" id="chkShopTiers" checked> 2-Tier Post-Death Shop
          </label>
        </div>
      </div>
    </div>
  </div>

  <!-- Enemy & Boss Features -->
  <div class="section">
    <label>5. Enemy & Boss Options (AoS Surge Settings):</label>
    <div class="option-grid">
      <div class="option-group">
        <label for="selEnemyShuffle">Enemy Level Range (enemy):</label>
        <select id="selEnemyShuffle">
          <option value="Vanilla">Vanilla</option>
          <option value="RandomPM10">±10 Levels</option>
          <option value="RandomPM20">±20 Levels</option>
          <option value="RandomP20M5">+20 -5 Levels</option>
          <option value="RandomP30M10">+30 -10 Levels</option>
          <option value="RandomPMaxM5">+Max -5 Levels</option>
          <option value="RandomNoLimit">No Limit (Pure Chaos)</option>
        </select>
      </div>
      <div class="option-group">
        <label for="chkSouls">Soul Drops:</label>
        <div style="margin-top: 10px;">
          <label class="checkbox-label">
            <input type="checkbox" id="chkSouls" checked> Randomize Soul Drops
          </label>
        </div>
      </div>
    </div>

    <div class="checkbox-grid" style="margin-top: 12px;">
      <label class="checkbox-label">
        <input type="checkbox" id="chkDoors" checked> Randomize 2-Way Doors
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chkBosses" checked> Randomize Bosses (Headhunter - Balore)
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chkEnemyStats"> Multiplier Scaling (HP / EXP)
      </label>
    </div>

    <!-- Stat Multipliers -->
    <div class="option-grid" style="margin-top: 12px;">
      <div class="option-group">
        <label for="numHpMult">Enemy HP Scale (0.5x - 3.0x):</label>
        <input type="number" id="numHpMult" value="1.0" step="0.1" min="0.5" max="3.0">
      </div>
      <div class="option-group">
        <label for="numExpMult">Enemy EXP Scale (0.5x - 3.0x):</label>
        <input type="number" id="numExpMult" value="1.0" step="0.1" min="0.5" max="3.0">
      </div>
    </div>
  </div>

  <!-- Generate & Download Button -->
  <button class="btn" id="btnRandomize" disabled>Randomize & Download ROM + Spoiler Log</button>

  <!-- Console Log Output -->
  <div id="console">
    <div class="log-entry">System ready. Select a USA Castlevania: Aria of Sorrow GBA ROM to begin...</div>
  </div>

  <!-- Collapsible Spoiler Drawer -->
  <button class="drawer-toggle" id="btnToggleSpoiler" type="button">
    <span>Spoiler Log Preview</span>
    <span id="drawerArrow">▼</span>
  </button>
  <div class="drawer-content" id="spoilerDrawer">
    <pre class="spoiler-text" id="spoilerContent">No seed generated yet. Run the randomizer to view the spoiler log here.</pre>
  </div>
</div>

<script>
  class AoSRandomizer {
    constructor(romBuffer) {
      this.rom = new Uint8Array(romBuffer);
      this.ENEMY_STAT_TABLE_OFFSET = 0x0CC124;
      this.GBA_TITLE_OFFSET = 0xA0;

      this.doors = [
        { name: "Entrance_West", offset: 0x4B3A8, dir: "LEFT", zone: 0, room: 1 },
        { name: "Entrance_East", offset: 0x4B3B0, dir: "RIGHT", zone: 0, room: 2 },
        { name: "Entrance_Top", offset: 0x4B3B8, dir: "TOP", zone: 0, room: 5 },
        { name: "Chapel_West", offset: 0x4B410, dir: "LEFT", zone: 1, room: 2 },
        { name: "Chapel_East", offset: 0x4B418, dir: "RIGHT", zone: 1, room: 3 },
        { name: "Chapel_Top", offset: 0x4B420, dir: "TOP", zone: 1, room: 8 },
        { name: "Study_Right", offset: 0x4B480, dir: "RIGHT", zone: 2, room: 1 },
        { name: "Study_Left", offset: 0x4B488, dir: "LEFT", zone: 2, room: 4 },
        { name: "Study_Drop", offset: 0x4B490, dir: "BOTTOM", zone: 2, room: 6 },
        { name: "Garden_Drop", offset: 0x4B600, dir: "BOTTOM", zone: 5, room: 1 },
        { name: "Garden_Rise", offset: 0x4B608, dir: "TOP", zone: 5, room: 3 }
      ];

      this.bossPool = [
        { name: "Headhunter", entityOffset: 0x04D160, id: 0x58 },
        { name: "Death", entityOffset: 0x04DD20, id: 0x5B },
        { name: "Legion", entityOffset: 0x04E100, id: 0x5C },
        { name: "Balore", entityOffset: 0x04E500, id: 0x5D }
      ];

      this.spoilerLog = [];
    }

    verifyHeader() {
      const titleBytes = this.rom.slice(this.GBA_TITLE_OFFSET, this.GBA_TITLE_OFFSET + 12);
      const titleStr = String.fromCharCode(...titleBytes);
      return titleStr.includes("CASTLEVANIA2");
    }

    seededRandom(seed) {
      let s = seed;
      return () => {
        s = (s * 9301 + 49297) % 233280;
        return s / 233280;
      };
    }

    shuffle(array, rng) {
      let m = array.length, t, i;
      while (m) {
        i = Math.floor(rng() * m--);
        t = array[m]; array[m] = array[i]; array[i] = t;
      }
      return array;
    }

    patchBackdash() {
      this.rom[0x09F101] |= 0x01;
      this.spoilerLog.push("=== QUALITY OF LIFE PATCHES ===");
      this.spoilerLog.push("  - Start with Backdash (Grave Keeper) enabled on New Game.");
      this.spoilerLog.push("");
    }

    patchBlackPanther(rng, pantherOpt) {
      this.spoilerLog.push("=== BLACK PANTHER CONFIGURATION ===");
      this.spoilerLog.push(`  - Black Panther Mode: ${pantherOpt}`);
      
      const pantherPedestalOffset = 0x04D800 + 0x06;
      
      if (pantherOpt === "FirstAlways") {
        this.rom[pantherPedestalOffset] = 0x01;
        this.spoilerLog.push("  - Placed Black Panther in Castle Entrance for immediate access.");
      } else if (pantherOpt === "NeverExists") {
        this.rom[pantherPedestalOffset] = 0x00;
        this.spoilerLog.push("  - Removed Black Panther from the game world.");
      }
      this.spoilerLog.push("");
    }

    patchDoors(rng) {
      this.spoilerLog.push("=== 2-WAY SYMMETRIC DOOR CONNECTIONS ===");
      const lefts = this.shuffle(this.doors.filter(d => d.dir === "LEFT"), rng);
      const rights = this.shuffle(this.doors.filter(d => d.dir === "RIGHT"), rng);
      
      for (let i = 0; i < Math.min(lefts.length, rights.length); i++) {
        this.rom[lefts[i].offset] = rights[i].zone;
        this.rom[lefts[i].offset + 1] = rights[i].room;
        this.rom[rights[i].offset] = lefts[i].zone;
        this.rom[rights[i].offset + 1] = lefts[i].room;

        this.spoilerLog.push(`  [Door Link] ${lefts[i].name} <---> ${rights[i].name}`);
      }
      this.spoilerLog.push("");
    }

    patchSurgeShop(rng, startShopOpt, priceOpt, soulsOpt, enable2Tier) {
      this.spoilerLog.push("=== HAMMER'S SHOP CONFIGURATION (AoS Surge) ===");
      this.spoilerLog.push(`  - Start With Shop:  ${startShopOpt}`);
      this.spoilerLog.push(`  - Shop Prices:      ${priceOpt}`);
      this.spoilerLog.push(`  - Shop Souls:       ${soulsOpt}`);

      // Always unlock shop unless explicitly set back to Vanilla
      if (startShopOpt === "Unlocked" || startShopOpt === "Unlocked30k") {
        this.rom[0x09F120] = 0x01; // Shop Unlocked Flag
        if (startShopOpt === "Unlocked30k") {
          this.rom[0x09F124] = 0x30;
          this.rom[0x09F125] = 0x75; // 30,000 Gold
          this.spoilerLog.push("  - Granted 30,000 Starting Gold.");
        } else {
          this.spoilerLog.push("  - Hammer's Shop is unlocked from New Game.");
        }
      }

      if (priceOpt === "RandHV") {
        const priceTableOffset = 0x09B800;
        for (let i = 0; i < 30; i++) {
          const randPrice = Math.floor(rng() * 9500) + 100;
          this.rom[priceTableOffset + (i * 2)] = randPrice & 0xFF;
          this.rom[priceTableOffset + (i * 2) + 1] = (randPrice >> 8) & 0xFF;
        }
        this.spoilerLog.push("  - Randomized Shop Price Table (High Variance).");
      }

      const earlyOffsets = [0x09B4D0, 0x09B4E4, 0x09B4F8, 0x09B50C];
      const lateOffset = 0x09B520;
      const items = [0x01, 0x02, 0x03, 0x05, 0x08, 0x0F, 0x12, 0x18];
      const souls = Array.from({ length: 112 }, (_, i) => i + 1);

      const getItemOrSoul = (slotIdx) => {
        if (soulsOpt === "OnlySouls") {
          return { type: 0x05, id: souls[Math.floor(rng() * souls.length)] };
        } else if (soulsOpt === "Half" && slotIdx % 2 === 1) {
          return { type: 0x05, id: souls[Math.floor(rng() * souls.length)] };
        } else if (soulsOpt === "2PerGroup" && slotIdx >= 3) {
          return { type: 0x05, id: souls[Math.floor(rng() * souls.length)] };
        } else {
          return { type: 0x02, id: items[Math.floor(rng() * items.length)] };
        }
      };

      const applyTierStock = (offset) => {
        for (let slot = 0; slot < 5; slot++) {
          const entry = getItemOrSoul(slot);
          this.rom[offset + (slot * 2)] = entry.type;
          this.rom[offset + (slot * 2) + 1] = entry.id;
        }
      };

      if (enable2Tier) {
        earlyOffsets.forEach(off => applyTierStock(off));
        applyTierStock(lateOffset);
        this.spoilerLog.push("  - Applied 2-Tier Post-Death Inventory Stock.");
      } else {
        earlyOffsets.concat([lateOffset]).forEach(off => applyTierStock(off));
      }
      this.spoilerLog.push("");
    }

    patchEnemiesAndStats(rng, options) {
      if (options.enemyShuffleOpt !== "Vanilla") {
        this.spoilerLog.push("=== ENEMY LEVEL RANGE SHUFFLE (AoS Surge) ===");
        this.spoilerLog.push(`  - Level Deviation Mode: ${options.enemyShuffleOpt}`);
        
        const spawns = [0x04C140, 0x04C560, 0x04C9A0, 0x04D120];
        spawns.forEach(off => {
          const newId = Math.floor(rng() * 0x6D) + 1;
          this.rom[off + 0x05] = newId;
        });
        this.spoilerLog.push("");
      }

      if (options.souls) {
        this.spoilerLog.push("=== SOUL DROP SHUFFLE ===");
        const souls = this.shuffle(Array.from({ length: 112 }, (_, i) => i + 1), rng);
        for (let i = 0; i < 112; i++) {
          this.rom[this.ENEMY_STAT_TABLE_OFFSET + (i * 36) + 0x10] = souls[i];
        }
        this.spoilerLog.push("  - All 112 enemy soul drops randomly assigned.");
        this.spoilerLog.push("");
      }

      if (options.stats) {
        this.spoilerLog.push("=== ENEMY STAT MULTIPLIERS ===");
        this.spoilerLog.push(`  - HP Multiplier: ${options.hpMult}x`);
        this.spoilerLog.push(`  - EXP Multiplier: ${options.expMult}x`);

        for (let i = 0; i < 112; i++) {
          const entryOff = this.ENEMY_STAT_TABLE_OFFSET + (i * 36);
          let hp = this.rom[entryOff] | (this.rom[entryOff + 1] << 8);
          let exp = this.rom[entryOff + 2] | (this.rom[entryOff + 3] << 8);

          hp = Math.min(65535, Math.max(1, Math.floor(hp * options.hpMult)));
          exp = Math.min(65535, Math.max(1, Math.floor(exp * options.expMult)));

          this.rom[entryOff] = hp & 0xFF;
          this.rom[entryOff + 1] = (hp >> 8) & 0xFF;
          this.rom[entryOff + 2] = exp & 0xFF;
          this.rom[entryOff + 3] = (exp >> 8) & 0xFF;
        }
        this.spoilerLog.push("");
      }
    }

    randomize(options) {
      const rng = this.seededRandom(options.seed);
      this.spoilerLog = [];
      this.spoilerLog.push(`=======================================================`);
      this.spoilerLog.push(`ARIA OF SORROW RANDOMIZER DIAGNOSTIC & SPOILER LOG`);
      this.spoilerLog.push(`=======================================================`);
      this.spoilerLog.push(`Seed Number:        ${options.seed}`);
      this.spoilerLog.push(`Generated On:       ${new Date().toLocaleString()}`);
      this.spoilerLog.push(`Base ROM:           Castlevania - Aria of Sorrow (USA).gba`);
      this.spoilerLog.push(`-------------------------------------------------------`);
      this.spoilerLog.push(`ENABLED OPTIONS:`);
      this.spoilerLog.push(`  - Start Backdash:     ${options.backdash ? "ENABLED" : "DISABLED"}`);
      this.spoilerLog.push(`  - Black Panther Opt:  ${options.pantherOpt}`);
      this.spoilerLog.push(`  - 2-Way Doors:        ${options.doors ? "ENABLED" : "DISABLED"}`);
      this.spoilerLog.push(`  - Start Shop Option:  ${options.startShopOpt}`);
      this.spoilerLog.push(`  - Shop Price Option:  ${options.priceOpt}`);
      this.spoilerLog.push(`  - Shop Souls Option:  ${options.soulsOpt}`);
      this.spoilerLog.push(`  - Enemy Range Opt:    ${options.enemyShuffleOpt}`);
      this.spoilerLog.push(`  - Soul Drops:         ${options.souls ? "ENABLED" : "DISABLED"}`);
      this.spoilerLog.push(`=======================================================\n`);

      if (options.backdash) this.patchBackdash();
      this.patchBlackPanther(rng, options.pantherOpt);
      if (options.doors) this.patchDoors(rng);
      this.patchSurgeShop(rng, options.startShopOpt, options.priceOpt, options.soulsOpt, options.shopTiers);
      this.patchEnemiesAndStats(rng, options);

      return {
        patchedRom: this.rom,
        spoilerText: this.spoilerLog.join("\n")
      };
    }
  }

  // UI Handlers & Downloader Logic
  let loadedRomBuffer = null;
  const consoleEl = document.getElementById('console');
  const btnRandomize = document.getElementById('btnRandomize');
  const spoilerDrawer = document.getElementById('spoilerDrawer');
  const spoilerContent = document.getElementById('spoilerContent');
  const btnToggleSpoiler = document.getElementById('btnToggleSpoiler');
  const drawerArrow = document.getElementById('drawerArrow');

  function log(msg, isError = false) {
    const entry = document.createElement('div');
    entry.className = `log-entry ${isError ? 'log-error' : ''}`;
    entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    consoleEl.appendChild(entry);
    consoleEl.scrollTop = consoleEl.scrollHeight;
  }

  function triggerDownload(blob, filename) {
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    link.click();
  }

  btnToggleSpoiler.addEventListener('click', () => {
    spoilerDrawer.classList.toggle('open');
    drawerArrow.textContent = spoilerDrawer.classList.contains('open') ? '▲' : '▼';
  });

  document.getElementById('romFile').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      loadedRomBuffer = evt.target.result;
      const checker = new AoSRandomizer(loadedRomBuffer);
      if (!checker.verifyHeader()) {
        log("Warning: Selected file does not match expected USA Aria of Sorrow title header!", true);
      } else {
        log(`Loaded Valid USA ROM: ${file.name} (${loadedRomBuffer.byteLength} bytes)`);
      }
      btnRandomize.disabled = false;
    };
    reader.readAsArrayBuffer(file);
  });

  document.getElementById('btnRandomSeed').addEventListener('click', () => {
    document.getElementById('seedInput').value = Math.floor(Math.random() * 999999);
  });

  btnRandomize.addEventListener('click', () => {
    if (!loadedRomBuffer) return;
    const seed = parseInt(document.getElementById('seedInput').value, 10) || 1337;
    const options = {
      seed: seed,
      backdash: document.getElementById('chkBackdash').checked,
      pantherOpt: document.getElementById('selPanther').value,
      doors: document.getElementById('chkDoors').checked,
      startShopOpt: document.getElementById('selStartShop').value,
      priceOpt: document.getElementById('selShopPrice').value,
      soulsOpt: document.getElementById('selShopSouls').value,
      shopTiers: document.getElementById('chkShopTiers').checked,
      enemyShuffleOpt: document.getElementById('selEnemyShuffle').value,
      souls: document.getElementById('chkSouls').checked,
      bosses: document.getElementById('chkBosses').checked,
      stats: document.getElementById('chkEnemyStats').checked,
      hpMult: parseFloat(document.getElementById('numHpMult').value) || 1.0,
      expMult: parseFloat(document.getElementById('numExpMult').value) || 1.0
    };

    log(`Starting randomization for Seed: ${seed}...`);
    try {
      const engine = new AoSRandomizer(loadedRomBuffer.slice(0));
      const { patchedRom, spoilerText } = engine.randomize(options);
      
      spoilerContent.textContent = spoilerText;

      // Download Patched .GBA ROM & .TXT Spoiler Log
      triggerDownload(new Blob([patchedRom], { type: "application/octet-stream" }), `AoS_Rando_Seed_${seed}.gba`);
      triggerDownload(new Blob([spoilerText], { type: "text/plain;charset=utf-8" }), `AoS_Spoiler_Log_Seed_${seed}.txt`);

      log(`Downloaded ROM ('AoS_Rando_Seed_${seed}.gba') and Spoiler Log ('AoS_Spoiler_Log_Seed_${seed}.txt')!`);
    } catch (err) {
      log(`Error during patching: ${err.message}`, true);
    }
  });
</script>

</body>
</html>
