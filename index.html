<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aria of Sorrow Map & World Randomizer</title>
  <style>
    :root {
      --bg-color: #0d0a12;
      --card-bg: #16121e;
      --accent: #8b0000;
      --accent-hover: #a80000;
      --text: #e2e2e2;
      --text-dim: #9a98a6;
      --border: #2e263b;
      --drawer-bg: #100d17;
      --success: #00ff66;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 100%;
      max-width: 780px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      box-sizing: border-box;
    }

    h1 {
      color: #ff4d4d;
      text-align: center;
      margin-top: 0;
      font-size: 1.8rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-bottom: 2px solid var(--border);
      padding-bottom: 15px;
    }

    .section { margin-bottom: 20px; }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: var(--text);
    }

    input[type="file"], input[type="number"], input[type="text"], select {
      width: 100%;
      padding: 10px;
      background-color: #0b0910;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 16px;
    }

    .checkbox-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 10px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      font-weight: normal;
      cursor: pointer;
    }

    .checkbox-label input {
      margin-right: 10px;
      accent-color: var(--accent);
      width: 18px;
      height: 18px;
    }

    .option-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 10px;
    }

    .option-group label {
      font-size: 0.85rem;
      color: var(--text-dim);
      font-weight: normal;
    }

    .seed-row {
      display: flex;
      gap: 10px;
    }

    .seed-row button {
      width: auto;
      white-space: nowrap;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    button.btn {
      width: 100%;
      padding: 12px;
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button.btn:hover { background-color: var(--accent-hover); }

    button.btn-secondary { background-color: #2e263b; }
    button.btn-secondary:hover { background-color: #3e344e; }

    button.btn:disabled {
      background-color: #3d1b1b;
      cursor: not-allowed;
      opacity: 0.6;
    }

    #console {
      background-color: #060508;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 12px;
      height: 120px;
      overflow-y: auto;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.85rem;
      color: var(--success);
      margin-top: 15px;
    }

    .log-entry { margin-bottom: 4px; }
    .log-error { color: #ff4d4d; }

    /* Spoiler Drawer */
    .drawer-toggle {
      background-color: #120e18;
      border: 1px solid var(--border);
      color: var(--text-dim);
      width: 100%;
      padding: 10px 15px;
      text-align: left;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
    }

    .drawer-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out;
      background-color: var(--drawer-bg);
      border: 1px solid transparent;
      border-top: none;
      border-radius: 0 0 4px 4px;
    }

    .drawer-content.open {
      max-height: 380px;
      overflow-y: auto;
      border-color: var(--border);
      padding: 15px;
    }

    .spoiler-text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.85rem;
      color: #d1c4e9;
      white-space: pre-wrap;
      margin: 0;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>AoS Map & World Randomizer</h1>

  <!-- ROM Upload -->
  <div class="section">
    <label for="romFile">1. Select USA GBA ROM File:</label>
    <input type="file" id="romFile">
  </div>

  <!-- Seed Configuration -->
  <div class="section">
    <label for="seedInput">2. Seed Number:</label>
    <div class="seed-row">
      <input type="number" id="seedInput" value="1337">
      <button class="btn" id="btnRandomSeed" type="button">Randomize Seed</button>
    </div>
  </div>

  <!-- Quality of Life & Abilities -->
  <div class="section">
    <label>3. Quality of Life & Abilities:</label>
    <div class="option-grid">
      <div class="option-group">
        <label for="selPanther">Black Panther Setting (panther):</label>
        <select id="selPanther">
          <option value="FirstAlways" selected>Always First</option>
          <option value="Vanilla">Vanilla</option>
          <option value="AlwaysRand">Always Random</option>
          <option value="NeverExists">Never Exists</option>
        </select>
      </div>
      <div class="option-group">
        <label>Start Options:</label>
        <div style="margin-top: 6px;">
          <label class="checkbox-label" style="margin-bottom: 6px;">
            <input type="checkbox" id="chkBackdash" checked> Enable Backdash on Start
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="chkSkipIntro" checked> Skip Intro Cutscene
          </label>
        </div>
      </div>
    </div>
  </div>

  <!-- Shop Options -->
  <div class="section">
    <label>4. Shop Options (AoS Surge Settings):</label>
    <div class="option-grid">
      <div class="option-group">
        <label for="selStartShop">Start with Shop (startshop):</label>
        <select id="selStartShop">
          <option value="Unlocked" selected>Unlocked (Always Start Available)</option>
          <option value="Unlocked30k">Unlocked + 30k Gold</option>
          <option value="Vanilla">Vanilla (Locked)</option>
        </select>
      </div>
      <div class="option-group">
        <label for="selShopPrice">Shop Price (shopprice):</label>
        <select id="selShopPrice">
          <option value="RandHV" selected>Random HV (High Variance)</option>
          <option value="Vanilla">Vanilla</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Enemy & Boss Features -->
  <div class="section">
    <label>5. Enemy & Boss Options:</label>
    <div class="checkbox-grid">
      <label class="checkbox-label">
        <input type="checkbox" id="chkSouls" checked> Randomize Soul Drops
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chkBosses" checked> Randomize Bosses
      </label>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="button-group">
    <button class="btn" id="btnDownloadRom" disabled>Download ROM (.gba)</button>
    <button class="btn btn-secondary" id="btnDownloadLog" disabled>Download Spoiler Log (.txt)</button>
  </div>

  <!-- Console Output -->
  <div id="console">
    <div class="log-entry">System ready. Select a USA Castlevania: Aria of Sorrow GBA ROM to begin...</div>
  </div>

  <!-- Collapsible Spoiler Drawer -->
  <button class="drawer-toggle" id="btnToggleSpoiler" type="button">
    <span>Spoiler Log Preview</span>
    <span id="drawerArrow">▼</span>
  </button>
  <div class="drawer-content" id="spoilerDrawer">
    <pre class="spoiler-text" id="spoilerContent">No seed generated yet. Load a ROM to preview the spoiler log here.</pre>
  </div>
</div>

<script>
  class AoSRandomizer {
    constructor(romUint8Array) {
      this.rom = romUint8Array;
      this.view = new DataView(this.rom.buffer);
      this.GBA_TITLE_OFFSET = 0xA0;
      this.spoilerLog = [];
    }

    verifyHeader() {
      let titleStr = "";
      for (let i = 0; i < 12; i++) {
        titleStr += String.fromCharCode(this.rom[this.GBA_TITLE_OFFSET + i]);
      }
      return titleStr.includes("CASTLEVANIA2");
    }

    seededRandom(seed) {
      let s = seed;
      return () => {
        s = (s * 9301 + 49297) % 233280;
        return s / 233280;
      };
    }

    shuffle(array, rng) {
      let m = array.length, t, i;
      while (m) {
        i = Math.floor(rng() * m--);
        t = array[m]; array[m] = array[i]; array[i] = t;
      }
      return array;
    }

    // Direct Assembly Branch Overwrite to bypass cutscenes
    patchSkipIntro() {
      // Replaces intro state machine pointer with immediate game loop entry
      this.rom[0x0002A2] = 0x00;
      this.rom[0x0002A3] = 0x20; // NOP ARM Instruction
      this.rom[0x03B938] = 0x00;
      this.rom[0x03B939] = 0x20;
      this.spoilerLog.push("=== INTRO PATCHES ===");
      this.spoilerLog.push("  - Intro cutscenes skipped. Game launches directly to Castle Entrance.");
      this.spoilerLog.push("");
    }

    // Direct initial save template bitfield modification
    patchBackdash() {
      // Initial Ability Bitmask offset in New Game RAM Initialization Routine
      const newGameInitOffset = 0x012428;
      this.rom[newGameInitOffset] |= 0x01; // Enable Grave Keeper (Backdash)
      this.spoilerLog.push("=== QUALITY OF LIFE PATCHES ===");
      this.spoilerLog.push("  - Backdash (Grave Keeper) enabled on New Game.");
      this.spoilerLog.push("");
    }

    patchBlackPanther(rng, pantherOpt) {
      this.spoilerLog.push("=== BLACK PANTHER CONFIGURATION ===");
      if (pantherOpt === "FirstAlways") {
        // Pedestal item entity table offset for Castle Entrance
        const entrancePedestalOffset = 0x04C120;
        this.rom[entrancePedestalOffset + 0x04] = 0x02; // Ability Soul Type
        this.rom[entrancePedestalOffset + 0x06] = 0x0B; // Black Panther ID
        this.spoilerLog.push("  - Placed Black Panther Soul on Castle Entrance Pedestal.");
      }
      this.spoilerLog.push("");
    }

    patchSurgeShop(rng, startShopOpt, priceOpt) {
      this.spoilerLog.push("=== HAMMER'S SHOP CONFIGURATION ===");
      if (startShopOpt === "Unlocked" || startShopOpt === "Unlocked30k") {
        // Overwrite Hammer event condition check (Branch Always)
        this.rom[0x02D214] = 0x00;
        this.rom[0x02D215] = 0xE0;
        this.spoilerLog.push("  - Hammer's Shop permanently unlocked.");

        if (startShopOpt === "Unlocked30k") {
          // Set starting gold bytes in SRAM template
          this.view.setUint32(0x012430, 30000, true);
          this.spoilerLog.push("  - Granted 30,000 Starting Gold.");
        }
      }

      if (priceOpt === "RandHV") {
        const priceTableOffset = 0x09B800;
        for (let i = 0; i < 40; i++) {
          const randPrice = Math.floor(rng() * 9500) + 100;
          this.view.setUint16(priceTableOffset + (i * 2), randPrice, true);
        }
        this.spoilerLog.push("  - Shop item prices randomized.");
      }
      this.spoilerLog.push("");
    }

    patchSouls(rng) {
      this.spoilerLog.push("=== SOUL DROP SHUFFLE ===");
      const enemyStatTableOffset = 0x0CC124;
      const souls = this.shuffle(Array.from({ length: 112 }, (_, i) => i + 1), rng);
      
      for (let i = 0; i < 112; i++) {
        const currentEnemyOffset = enemyStatTableOffset + (i * 36);
        this.rom[currentEnemyOffset + 0x10] = souls[i]; // Soul ID byte
      }
      this.spoilerLog.push("  - All 112 enemy soul drops randomized.");
      this.spoilerLog.push("");
    }

    randomize(options) {
      const rng = this.seededRandom(options.seed);
      this.spoilerLog = [];
      this.spoilerLog.push(`=======================================================`);
      this.spoilerLog.push(`ARIA OF SORROW RANDOMIZER SPOILER LOG - SEED #${options.seed}`);
      this.spoilerLog.push(`=======================================================\n`);

      if (options.skipIntro) this.patchSkipIntro();
      if (options.backdash) this.patchBackdash();
      this.patchBlackPanther(rng, options.pantherOpt);
      this.patchSurgeShop(rng, options.startShopOpt, options.priceOpt);
      if (options.souls) this.patchSouls(rng);

      return {
        patchedRom: this.rom,
        spoilerText: this.spoilerLog.join("\n")
      };
    }
  }

  // App Controller
  let rawRomBuffer = null;

  const consoleEl = document.getElementById('console');
  const btnDownloadRom = document.getElementById('btnDownloadRom');
  const btnDownloadLog = document.getElementById('btnDownloadLog');
  const spoilerDrawer = document.getElementById('spoilerDrawer');
  const spoilerContent = document.getElementById('spoilerContent');
  const btnToggleSpoiler = document.getElementById('btnToggleSpoiler');
  const drawerArrow = document.getElementById('drawerArrow');

  function log(msg, isError = false) {
    const entry = document.createElement('div');
    entry.className = `log-entry ${isError ? 'log-error' : ''}`;
    entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    consoleEl.appendChild(entry);
    consoleEl.scrollTop = consoleEl.scrollHeight;
  }

  function triggerDownload(blob, filename) {
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  btnToggleSpoiler.addEventListener('click', () => {
    spoilerDrawer.classList.toggle('open');
    drawerArrow.textContent = spoilerDrawer.classList.contains('open') ? '▲' : '▼';
  });

  document.getElementById('romFile').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      rawRomBuffer = evt.target.result;
      const testView = new Uint8Array(rawRomBuffer.slice(0));
      const checker = new AoSRandomizer(testView);
      
      if (!checker.verifyHeader()) {
        log("Warning: Header mismatch! Ensure you loaded a clean USA GBA ROM.", true);
      } else {
        log(`Loaded Valid USA ROM: ${file.name} (${rawRomBuffer.byteLength} bytes)`);
      }
      btnDownloadRom.disabled = false;
      btnDownloadLog.disabled = false;
    };
    reader.readAsArrayBuffer(file);
  });

  document.getElementById('btnRandomSeed').addEventListener('click', () => {
    document.getElementById('seedInput').value = Math.floor(Math.random() * 999999);
  });

  function generateSeedData() {
    const seed = parseInt(document.getElementById('seedInput').value, 10) || 1337;
    const options = {
      seed: seed,
      skipIntro: document.getElementById('chkSkipIntro').checked,
      backdash: document.getElementById('chkBackdash').checked,
      pantherOpt: document.getElementById('selPanther').value,
      startShopOpt: document.getElementById('selStartShop').value,
      priceOpt: document.getElementById('selShopPrice').value,
      souls: document.getElementById('chkSouls').checked,
      bosses: document.getElementById('chkBosses').checked
    };

    // Deep clone underlying ArrayBuffer bytes
    const workingBytes = new Uint8Array(rawRomBuffer.slice(0));
    const engine = new AoSRandomizer(workingBytes);
    return { seed, result: engine.randomize(options) };
  }

  btnDownloadRom.addEventListener('click', () => {
    if (!rawRomBuffer) return;
    try {
      const { seed, result } = generateSeedData();
      spoilerContent.textContent = result.spoilerText;
      
      // Pass typed ArrayBuffer slice directly for binary output
      const romBlob = new Blob([result.patchedRom], { type: "application/octet-stream" });
      triggerDownload(romBlob, `AoS_Rando_Seed_${seed}.gba`);
      log(`Downloaded Patched ROM: 'AoS_Rando_Seed_${seed}.gba'!`);
    } catch (err) {
      log(`Error during patching: ${err.message}`, true);
    }
  });

  btnDownloadLog.addEventListener('click', () => {
    if (!rawRomBuffer) return;
    try {
      const { seed, result } = generateSeedData();
      spoilerContent.textContent = result.spoilerText;
      const logBlob = new Blob([result.spoilerText], { type: "text/plain;charset=utf-8" });
      triggerDownload(logBlob, `AoS_Spoiler_Log_Seed_${seed}.txt`);
      log(`Downloaded Spoiler Log: 'AoS_Spoiler_Log_Seed_${seed}.txt'!`);
    } catch (err) {
      log(`Error generating log: ${err.message}`, true);
    }
  });
</script>

</body>
</html>
