<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aria of Sorrow Map & World Randomizer</title>
  <style>
    :root {
      --bg-color: #0d0a12;
      --card-bg: #16121e;
      --accent: #8b0000;
      --accent-hover: #a80000;
      --text: #e2e2e2;
      --text-dim: #9a98a6;
      --border: #2e263b;
      --drawer-bg: #100d17;
      --success: #00ff66;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 100%;
      max-width: 780px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    h1 {
      color: #ff4d4d;
      text-align: center;
      margin-top: 0;
      font-size: 1.8rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-bottom: 2px solid var(--border);
      padding-bottom: 15px;
    }

    .section { margin-bottom: 20px; }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: var(--text);
    }

    input[type="file"], input[type="number"], input[type="text"], select {
      width: 100%;
      padding: 10px;
      background-color: #0b0910;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 4px;
      box-sizing: border-box;
    }

    .checkbox-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 10px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      font-weight: normal;
      cursor: pointer;
    }

    .checkbox-label input {
      margin-right: 10px;
      accent-color: var(--accent);
    }

    .option-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 10px;
    }

    .option-group label {
      font-size: 0.85rem;
      color: var(--text-dim);
      font-weight: normal;
    }

    .seed-row {
      display: flex;
      gap: 10px;
    }

    .seed-row button {
      width: auto;
      white-space: nowrap;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    button.btn {
      width: 100%;
      padding: 12px;
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button.btn:hover { background-color: var(--accent-hover); }

    button.btn:disabled {
      background-color: #3d1b1b;
      cursor: not-allowed;
      opacity: 0.6;
    }

    #console {
      background-color: #060508;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 12px;
      height: 110px;
      overflow-y: auto;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.85rem;
      color: var(--success);
      margin-top: 15px;
    }

    .log-entry { margin-bottom: 4px; }
    .log-error { color: #ff4d4d; }

    /* Spoiler Drawer */
    .drawer-toggle {
      background-color: #120e18;
      border: 1px solid var(--border);
      color: var(--text-dim);
      width: 100%;
      padding: 10px 15px;
      text-align: left;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
    }

    .drawer-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out;
      background-color: var(--drawer-bg);
      border: 1px solid transparent;
      border-top: none;
      border-radius: 0 0 4px 4px;
    }

    .drawer-content.open {
      max-height: 380px;
      overflow-y: auto;
      border-color: var(--border);
      padding: 15px;
    }

    .spoiler-text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.85rem;
      color: #d1c4e9;
      white-space: pre-wrap;
      margin: 0;
    }
  </style>
</head>

  <h1>AoS Map & World Randomizer</h1>

  <!-- ROM Upload -->
  <div class="section">
    <label for="romFile">1. Select USA GBA ROM File:</label>
    <input type="file" id="romFile" accept=".gba">
  </div>

  <!-- Seed Configuration -->
  <div class="section">
    <label for="seedInput">2. Seed Number:</label>
    <div class="seed-row">
      <input type="number" id="seedInput" value="1337">
      <button class="btn" id="btnRandomSeed" type="button">Randomize Seed</button>
    </div>
  </div>

          <option value="NeverExists">Never Exists</option>
        </select>
