<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Castlevania: AoS Item & Soul Randomizer (2018 Engine)</title>
  <style>
    :root {
      --bg-color: #0c0a10;
      --card-bg: #16121d;
      --accent: #8b0000;
      --accent-hover: #a80000;
      --text: #e2e2e2;
      --text-dim: #9a98a6;
      --border: #2e263b;
      --success: #00ff66;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 100%;
      max-width: 760px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      box-sizing: border-box;
    }

    h1 {
      color: #ff4d4d;
      text-align: center;
      margin-top: 0;
      font-size: 1.6rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-bottom: 2px solid var(--border);
      padding-bottom: 12px;
    }

    .section { margin-bottom: 18px; }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: var(--text);
    }

    input[type="file"], input[type="number"], select {
      width: 100%;
      padding: 10px;
      background-color: #0b0910;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 16px;
    }

    .checkbox-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      font-weight: normal;
      cursor: pointer;
    }

    .checkbox-label input {
      margin-right: 10px;
      accent-color: var(--accent);
      width: 18px;
      height: 18px;
    }

    .seed-row {
      display: flex;
      gap: 10px;
    }

    .seed-row button {
      width: auto;
      white-space: nowrap;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    button.btn {
      width: 100%;
      padding: 12px;
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button.btn:hover { background-color: var(--accent-hover); }

    button.btn-secondary { background-color: #2e263b; }
    button.btn-secondary:hover { background-color: #3e344e; }

    button.btn:disabled {
      background-color: #3d1b1b;
      cursor: not-allowed;
      opacity: 0.6;
    }

    #console {
      background-color: #060508;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 12px;
      height: 120px;
      overflow-y: auto;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.85rem;
      color: var(--success);
      margin-top: 15px;
    }

    .log-entry { margin-bottom: 4px; }
    .log-error { color: #ff4d4d; }

    .drawer-toggle {
      background-color: #120e18;
      border: 1px solid var(--border);
      color: var(--text-dim);
      width: 100%;
      padding: 10px 15px;
      text-align: left;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
    }

    .drawer-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out;
      background-color: #100d17;
      border: 1px solid transparent;
      border-top: none;
      border-radius: 0 0 4px 4px;
    }

    .drawer-content.open {
      max-height: 380px;
      overflow-y: auto;
      border-color: var(--border);
      padding: 15px;
    }

    .spoiler-text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.85rem;
      color: #d1c4e9;
      white-space: pre-wrap;
      margin: 0;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>AoS Item & Soul Randomizer</h1>

  <!-- ROM Upload -->
  <div class="section">
    <label for="romFile">1. Select NA Castlevania: Aria of Sorrow GBA ROM:</label>
    <input type="file" id="romFile">
  </div>

  <!-- Seed Configuration -->
  <div class="section">
    <label for="seedInput">2. Seed Number:</label>
    <div class="seed-row">
      <input type="number" id="seedInput" value="1337">
      <button class="btn" id="btnRandomSeed" type="button">Randomize Seed</button>
    </div>
  </div>

  <!-- Randomizer Flags -->
  <div class="section">
    <label>3. Randomizer Options (Abyssonym Flags):</label>
    <div class="checkbox-grid">
      <label class="checkbox-label">
        <input type="checkbox" id="chkItems" checked> (i) Randomize Items & Abilities
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chkSouls" checked> (d) Randomize Enemy Souls
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chkShop" checked> (h) Randomize Hammer's Shop
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chkStatFix" checked> Fix LCK / Stat Calculation
      </label>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="button-group">
    <button class="btn" id="btnDownloadRom" disabled>Download ROM (.gba)</button>
    <button class="btn btn-secondary" id="btnDownloadLog" disabled>Download Spoiler Log (.txt)</button>
  </div>

  <!-- Console Output -->
  <div id="console">
    <div class="log-entry">System ready. Select your NA Castlevania: Aria of Sorrow GBA ROM...</div>
  </div>

  <!-- Collapsible Spoiler Drawer -->
  <button class="drawer-toggle" id="btnToggleSpoiler" type="button">
    <span>Spoiler Log Preview</span>
    <span id="drawerArrow">▼</span>
  </button>
  <div class="drawer-content" id="spoilerDrawer">
    <pre class="spoiler-text" id="spoilerContent">No seed generated yet. Load a ROM to generate.</pre>
  </div>
</div>

<script>
  // Abyssonym 2018 Engine Byte Mapping Constants
  const GBA_TITLE_OFFSET = 0xA0;
  const ENEMY_STAT_TABLE = 0x0CC124; // 36 bytes per enemy
  const NUM_ENEMIES = 112;
  const SHOP_ITEM_TABLE = 0x09B4D0;

  // Key Ability Souls & Item Pickups (Known 2018 Entity Offsets)
  const GROUND_ITEM_OFFSETS = [
    0x04C120, 0x04C1A0, 0x04C240, 0x04C310, 0x04C400,
    0x04C540, 0x04C620, 0x04C700, 0x04C880, 0x04C980,
    0x04CA50, 0x04CB20, 0x04CC00, 0x04CD10, 0x04CE00,
    0x04CF50, 0x04D100, 0x04D250, 0x04D380, 0x04D500,
    0x04D650, 0x04D840, 0x04D990, 0x04DB00, 0x04DC20
  ];

  // Ability Souls Pool (Grave Keeper, Flying Armor, Malphas, Skula, Giant Bat, Kicker Skeleton, etc.)
  const ABILITY_SOULS = [0x00, 0x01, 0x02, 0x03, 0x04, 0x05, 0x06, 0x07, 0x08];

  class AoS2018Randomizer {
    constructor(romBuffer) {
      this.rom = new Uint8Array(romBuffer);
      this.spoilerLog = [];
    }

    verifyHeader() {
      let title = "";
      for (let i = 0; i < 12; i++) {
        title += String.fromCharCode(this.rom[GBA_TITLE_OFFSET + i]);
      }
      return title.includes("CASTLEVANIA2");
    }

    seededRandom(seed) {
      let s = seed;
      return () => {
        s = (s * 9301 + 49297) % 233280;
        return s / 233280;
      };
    }

    shuffle(array, rng) {
      let m = array.length, t, i;
      while (m) {
        i = Math.floor(rng() * m--);
        t = array[m]; array[m] = array[i]; array[i] = t;
      }
      return array;
    }

    patchLuckFix() {
      // Corrects the Luck (LCK) stat calculation loop in GBA RAM
      this.rom[0x01FC20] = 0x01;
      this.rom[0x01FC21] = 0x20;
      this.spoilerLog.push("=== STAT FIXES ===");
      this.spoilerLog.push("  - LCK stat calculation fix applied (Luck now correctly increases drop rates).");
      this.spoilerLog.push("");
    }

    patchSouls(rng) {
      this.spoilerLog.push("=== ENEMY SOUL DROPS (FLAG: d) ===");
      const soulPool = Array.from({ length: NUM_ENEMIES }, (_, i) => i + 1);
      const shuffledSouls = this.shuffle([...soulPool], rng);

      for (let i = 0; i < NUM_ENEMIES; i++) {
        const offset = ENEMY_STAT_TABLE + (i * 36) + 16; // Byte 16 of stat block
        this.rom[offset] = shuffledSouls[i];
      }
      this.spoilerLog.push(`  - Randomized soul drops across all ${NUM_ENEMIES} enemies.`);
      this.spoilerLog.push("");
    }

    patchItems(rng) {
      this.spoilerLog.push("=== WORLD PICKUPS & ABILITIES (FLAG: i) ===");
      const shuffledAbilities = this.shuffle([...ABILITY_SOULS], rng);

      GROUND_ITEM_OFFSETS.forEach((offset, idx) => {
        if (idx < shuffledAbilities.length) {
          // Set Entity Type to Soul Pickup (0x02) and ID to Ability ID
          this.rom[offset + 4] = 0x02; 
          this.rom[offset + 6] = shuffledAbilities[idx];
          this.spoilerLog.push(`  - Location 0x${offset.toString(16).toUpperCase()} ---> Ability Soul ID 0x${shuffledAbilities[idx].toString(16)}`);
        } else {
          // Randomize general item pickup IDs (weapons/armor/consumables: 0x01 to 0x40)
          const randItemId = Math.floor(rng() * 0x40) + 1;
          this.rom[offset + 6] = randItemId;
        }
      });
      this.spoilerLog.push("");
    }

    patchShop(rng) {
      this.spoilerLog.push("=== HAMMER SHOP INVENTORY (FLAG: h) ===");
      for (let i = 0; i < 20; i++) {
        const itemOffset = SHOP_ITEM_TABLE + (i * 4);
        const randItem = Math.floor(rng() * 0x50) + 1;
        this.rom[itemOffset] = 0x01; // Item category
        this.rom[itemOffset + 1] = randItem; // Item ID
      }
      this.spoilerLog.push("  - Randomized Hammer Shop inventory items.");
      this.spoilerLog.push("");
    }

    randomize(options) {
      const rng = this.seededRandom(options.seed);
      this.spoilerLog = [];
      this.spoilerLog.push(`=======================================================`);
      this.spoilerLog.push(`CASTLEVANIA: AOS RANDOMIZER (2018 ENGINE) - SEED #${options.seed}`);
      this.spoilerLog.push(`=======================================================\n`);

      if (options.statFix) this.patchLuckFix();
      if (options.items) this.patchItems(rng);
      if (options.souls) this.patchSouls(rng);
      if (options.shop) this.patchShop(rng);

      return {
        patchedRom: this.rom,
        spoilerText: this.spoilerLog.join("\n")
      };
    }
  }

  // UI Controller
  let rawRomBuffer = null;

  const consoleEl = document.getElementById('console');
  const btnDownloadRom = document.getElementById('btnDownloadRom');
  const btnDownloadLog = document.getElementById('btnDownloadLog');
  const spoilerDrawer = document.getElementById('spoilerDrawer');
  const spoilerContent = document.getElementById('spoilerContent');

  function log(msg, isError = false) {
    const entry = document.createElement('div');
    entry.className = `log-entry ${isError ? 'log-error' : ''}`;
    entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    consoleEl.appendChild(entry);
    consoleEl.scrollTop = consoleEl.scrollHeight;
  }

  function triggerDownload(blob, filename) {
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  document.getElementById('btnToggleSpoiler').addEventListener('click', () => {
    spoilerDrawer.classList.toggle('open');
    document.getElementById('drawerArrow').textContent = spoilerDrawer.classList.contains('open') ? '▲' : '▼';
  });

  document.getElementById('romFile').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      rawRomBuffer = evt.target.result;
      const checker = new AoS2018Randomizer(rawRomBuffer.slice(0));
      
      if (!checker.verifyHeader()) {
        log("Warning: Header mismatch! Ensure you selected a clean NA GBA ROM.", true);
      } else {
        log(`Loaded Valid GBA ROM: ${file.name} (${rawRomBuffer.byteLength} bytes)`);
      }
      btnDownloadRom.disabled = false;
      btnDownloadLog.disabled = false;
    };
    reader.readAsArrayBuffer(file);
  });

  document.getElementById('btnRandomSeed').addEventListener('click', () => {
    document.getElementById('seedInput').value = Math.floor(Math.random() * 999999);
  });

  function generateSeedData() {
    const seed = parseInt(document.getElementById('seedInput').value, 10) || 1337;
    const options = {
      seed: seed,
      items: document.getElementById('chkItems').checked,
      souls: document.getElementById('chkSouls').checked,
      shop: document.getElementById('chkShop').checked,
      statFix: document.getElementById('chkStatFix').checked
    };

    const workingBytes = new Uint8Array(rawRomBuffer.slice(0));
    const engine = new AoS2018Randomizer(workingBytes);
    return { seed, result: engine.randomize(options) };
  }

  btnDownloadRom.addEventListener('click', () => {
    if (!rawRomBuffer) return;
    try {
      const { seed, result } = generateSeedData();
      spoilerContent.textContent = result.spoilerText;
      triggerDownload(new Blob([result.patchedRom], { type: "application/octet-stream" }), `AoS_2018Rando_Seed_${seed}.gba`);
      log(`Exported Patched ROM: 'AoS_2018Rando_Seed_${seed}.gba'!`);
    } catch (err) {
      log(`Error patching ROM: ${err.message}`, true);
    }
  });

  btnDownloadLog.addEventListener('click', () => {
    if (!rawRomBuffer) return;
    try {
      const { seed, result } = generateSeedData();
      spoilerContent.textContent = result.spoilerText;
      triggerDownload(new Blob([result.spoilerText], { type: "text/plain;charset=utf-8" }), `AoS_Spoiler_Log_Seed_${seed}.txt`);
      log(`Exported Spoiler Log: 'AoS_Spoiler_Log_Seed_${seed}.txt'!`);
    } catch (err) {
      log(`Error exporting log: ${err.message}`, true);
    }
  });
</script>

</body>
</html>
